# CNN (ResNet-50) Training Configuration

learning_rate: 0.001
batch_size: 32
epochs: 50
image_size: 224
num_classes: 9

# Dataset paths
dataset_path: "data/chest_xray"

# Model weights path
weights_path: "backend/weights/resnet50_best.pth"

# Training parameters
optimizer: "Adam"
scheduler: "ReduceLROnPlateau"
early_stopping_patience: 5

# Augmentation
use_augmentation: true
augmentation_strength: 0.3

# Device
device: "cuda"  # or "cpu"
