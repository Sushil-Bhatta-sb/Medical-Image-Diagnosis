# Classical ML Model Training Configuration
# Trains and compares SVM and XGBoost, saves the best

# SVM parameters
svm_kernel: "rbf"
svm_C: 100
svm_gamma: "scale"

# XGBoost parameters
xgboost_n_estimators: 200
xgboost_max_depth: 7
xgboost_learning_rate: 0.1
xgboost_subsample: 0.8
xgboost_colsample_bytree: 0.8

# Feature extraction
features: ["hog", "lbp"]
hog_orientations: 9
hog_pixels_per_cell: 8
hog_cells_per_block: 2
lbp_radius: 1
lbp_points: 8

# Dataset paths
dataset_path: "data/chest_xray"
num_classes: 9

# Model weights path
weights_path: "backend/weights/svm_pipeline.pkl"

# Training parameters
test_split: 0.2
random_seed: 42
