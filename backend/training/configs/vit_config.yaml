model:
  architecture: Vision Transformer
  framework: PyTorch
  pretrained: true
  patch_size: 16

training:
  epochs: 30
  batch_size: 16
  learning_rate: 0.0001
  optimizer: AdamW
  loss_function: CrossEntropyLoss

data:
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  image_size: [224, 224]
  augmentation: true
